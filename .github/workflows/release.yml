name: Release

# Публикует в crates.io и создаёт релиз на GitHub при пуше тега вида v0.1.0.
# Нужен секрет репозитория CARGO_REGISTRY_TOKEN (токен crates.io).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - name: Publish rebirth-noise to crates.io
        run: cargo publish -p rebirth-noise
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
